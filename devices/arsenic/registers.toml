[registers.retrace_status]
offset = 0x0
width = 32
access = "rw"
space = "retrace"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, retrace interrupt routine; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Retrace latch in its own 32-bit window, wired to line 24 of the system interrupt controller (latched). The retrace handler reads it, writes back the bitwise complement of what it read and does not read it again. That only clears the bits if a written 0 clears a bit and a written 1 leaves it, so the register is write-0-to-clear (inferred). The handler counts a frame when bit 1 was set (in a stereo mode only on the fields where the low bit of its field counter is 1) and queues the whole word, not only the bits it counted: it takes a record from the free list, stores the word in it and links it behind the pending ones, and queues the deferred routine; if a record is already pending, the word is dropped and only a counter grows (established). The deferred routine tests bit 0 and, only when bit 0 is clear, bit 1, and no other bit; what the other bits are is unknown. The firmware's hand-over routine writes the complement of the word the same way. The name is ours: the register has no public name."
[registers.retrace_status.fields]
release_copies = { bits = [0, 0], grade = "inferred", doc = "the deferred routine releases the held swap copies, only while the live line is in [line 0, height - 3) or the mode is stereo (established for the software); that the bit is the scan-line interrupt 0 latch is inferred" }
frame_end = { bits = [1, 1], grade = "inferred", doc = "a frame has ended; the deferred routine flips the display tile list (in a mono mode only while a swap copy is pending) and signals the vertical-blank wait event; tested only when bit 0 is clear" }

