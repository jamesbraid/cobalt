[registers.vt_intr01]
offset = 0x10020
width = 32
access = "rw"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, interrupt routines; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Scan-line interrupt lines 1 (11:0) and 0 (23:12). The NT miniport parks both at 0xfff, then `CoSetMode` arms line 0 at the screen height less an allowance less one, and line 1 at the height plus one (plus two with the flat-panel timing flag of the mode record). The allowance is (field rate / 1000) * vertical total * 300 / 1,000,000, in integers: 9 lines for the built-in 640 by 480 mode at 59.94 Hz, so line 0 is 470 and line 1 is 481 (established). The firmware's hand-over routine parks both and writes 0x1fff. The only shipped consumer is the miniport's retrace handler, which sees the interrupts through retrace_status; no routine reads these lines back except the writer's own read-modify-write. That scan-line interrupt 0 and 1 are what set bits 0 and 1 of retrace_status is inferred from the order and position of the two lines."
[registers.vt_intr01.fields]
intr1_y = { bits = [11, 0], grade = "inferred", doc = "line of scan-line interrupt 1" }
intr0_y = { bits = [23, 12], grade = "inferred", doc = "line of scan-line interrupt 0" }

