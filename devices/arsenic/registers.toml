doc = "Live copy of the overlay control word. The NT miniport, the firmware and the Windows 2000 frame buffer driver poll bit 0 with a byte load until it clears (the firmware polls it until it reads set); the NT 4.0 HAL reads it as a dword. Bit 0 must follow its shadow within the 200 ms the drivers allow."
[registers.ovr_inhwctrl.fields]
ovr_dma_enable = { bits = [0, 0], grade = "inferred", doc = "overlay fetch active" }

[registers.ovr_control]
offset = 0x20008
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, display driver overlay routines"
doc = "Overlay control, the shadow word taken at the start of vertical blank. Bit 0 enables fetch; the rest is the overlay's tile-list pointer. The miniport loads the pointer without bit 0; the display driver writes the pointer with bit 0 set to start the fetch and the pointer alone to stop it. The firmware self-test walks bits 31:5 and 1:0."
[registers.ovr_control.fields]
ovr_dma_enable = { bits = [0, 0], grade = "inferred", doc = "overlay fetch enable" }
ovr_tile_ptr = { bits = [31, 9], grade = "inferred", doc = "address bits 31:9 of the overlay tile list, 512-byte aligned; the span is by analogy with the normal plane" }

[registers.frm_size_tile]
offset = 0x30000
width = 32
access = "rw"
grade = "established"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, mode-set routine; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Normal plane width and depth. Whole tile columns in 12:5 and the remainder in 32-byte units in 4:0, depth in 14:13, FIFO reset in bit 15 pulsed. A tile is 512 bytes by 128 lines, so a 32-bit mode has 128 pixels per tile column and a 16-bit mode 256. The NT miniport writes the value twice around the reset pulse; the firmware does the same. Linux, NT and the O2 display back end page agree.  The writers disagree on the width: the NT miniport, the Windows 2000 frame buffer miniport and the firmware write the exact line length in bytes (whole columns plus the remainder in 32-byte units, 0x24 for 640 pixels at 8 bits), while Linux and the Windows 2000 boot video driver write the length rounded up to whole columns with a zero remainder (0x40 for 640 and for 800 pixels at 8 bits; 0x60 for 1280). All of these are read from the writers. The register is not the visible width: every writer also programs the pixel-enable windows (`vt_hpixen`, `vt_vpixen`), whose lengths are the visible width less 2 and the visible height. The register is also what selects the linear form's line pitch (see `frm_control`). What the fetch does with the bytes past the exact length is inferred (shown pixels come from the windows). The firmware self-test walks bits 15:0."
[registers.frm_size_tile.fields]
frm_width_tile = { bits = [12, 5], grade = "established", doc = "whole 512-byte tile columns" }
frm_rhs = { bits = [4, 0], grade = "established", doc = "remainder in 32-byte units" }
frm_depth = { bits = [14, 13], grade = "established", enum = "frame_depth", doc = "pixel depth; the value 3 is not used by any driver" }
frm_fifo_reset = { bits = [15, 15], grade = "established", doc = "FIFO reset, pulsed set then clear" }

[registers.frm_size_pixel]
offset = 0x30004
width = 32
access = "rw"
grade = "established"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, mode-set routine; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Normal plane height in lines, in 31:16. The firmware self-test walks only those bits."
[registers.frm_size_pixel.fields]
fb_height_pix = { bits = [31, 16], grade = "established", doc = "height in lines" }

[registers.frm_inhwctrl]
offset = 0x30008
width = 32
access = "r"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, page-flip and stop routines"
doc = "Live copy of the normal plane control word. Completion of a page flip is this word matching the value written; stop waits for bit 0 to clear. Software reads bit 0 with a byte load in the NT miniport, the Windows 2000 frame buffer driver and the firmware, and as a dword in the Windows 2000 boot video driver and the NT 4.0 HAL; a model must answer a byte read with the matching byte. The firmware waits forever for bit 0 to read set after it starts the plane. Bit 0 must clear within 200 ms of its shadow and follow it at the start of vertical blank."
[registers.frm_inhwctrl.fields]
frm_dma_enable = { bits = [0, 0], grade = "inferred", doc = "normal plane fetch active" }
frm_linear = { bits = [1, 1], grade = "inferred", doc = "linear form, copy of the shadow; by analogy with the normal plane" }
frm_tile_ptr = { bits = [31, 9], grade = "inferred", doc = "address bits 31:9, copy of the shadow's address field; by analogy with the normal plane" }

[registers.frm_control]
offset = 0x3000c
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, start, flip and stop routines; SGI Visual Workstation PROM 1.1005, display start-up code and console drawing routines; Windows 2000 boot video driver and frame buffer miniport and display driver, row-addressing and stride code"
doc = "Normal plane control, the shadow word taken at the start of vertical blank. Bit 0 enables fetch; bit 1 selects the linear form, in which the pointer is the frame buffer's physical address shifted right 9 (Linux, both Windows 2000 drivers and the firmware set it, the SGI 5.2.4 miniport does not and gives its tile list instead). The line pitch follows the width register's remainder (inferred, from the shipped writers): with a remainder the lines are whole tile columns apart, 1024 bytes at 640 pixels at 8 bits (the firmware, `sglfb.sys` and `sglfb.dll` all lay frames out that way); with none they are the visible width apart, 640 bytes at 640 pixels (the Windows 2000 boot video driver's row step is the mode width, and Linux lays lines at `xres_virtual` times the pixel size). The two layouts coincide whenever the visible width in bytes is a multiple of 512. Nothing documents the rule or its mechanism. In the tile-list form the pointer is the physical address of a 512-byte aligned list of 16-bit entries. Both stop DMA by clearing bit 0 and wait up to 20000 ten-microsecond steps for the live copy to follow. The firmware self-test walks bits 31:9 and 1:0."
[registers.frm_control.fields]
frm_dma_enable = { bits = [0, 0], grade = "inferred", doc = "normal plane fetch enable" }
frm_linear = { bits = [1, 1], grade = "inferred", doc = "linear form" }
frm_tile_ptr = { bits = [31, 9], grade = "inferred", doc = "address bits 31:9: the tile list address, or the frame buffer address in the linear form, shifted right 9" }

[registers.did_inhwctrl]
