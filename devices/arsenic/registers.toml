from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, mode-set, power-state and retrace routines"
doc = "Polarity and blanking flags of the timing signals. The mode set writes bit 2 for the horizontal flag of the mode record and bit 0 for the vertical one, after writing 0x40 and then 0. The power-state routine edits bits 1 and 3 for the standby, suspend and off states (bit 1 for standby, bit 3 for suspend, both for the rest); which signal each gates is inferred from the VESA states, bit 1 horizontal and bit 3 vertical. The retrace handler sets bit 6 in stereo modes and clears it again when free-running. The firmware self-test walks bits 6:0. The firmware does not write the register."
