doc = "Per-window id fetch control, the shadow word. The NT miniport writes 0 at mode set and clears bit 16 to stop; the firmware writes 0. The firmware self-test walks all 32 bits."
[registers.did_control.fields]
did_dma_enable = { bits = [16, 16], grade = "inferred", doc = "id fetch enable, bit 16 (the NT driver clears it to stop); the Linux header names bit 0, which looks wrong" }

