unit = "arsenic"
prefix = "ARS"
block = "ARS"
title = "Arsenic display back end register block"
doc = "The display back end of the graphics subsystem: the register block the NT 4.0 miniport and display driver, the Windows 2000 display drivers, the firmware and the Linux frame buffer driver program. Offsets are from the start of the block, which the display miniport maps; all accesses are 32 bits wide and uncached, with a few byte loads of live words noted per register. The retrace latch is a separate 32-bit window outside the block and sits in its own address space. Access records what the drivers do to the register. Reset values are unknown for every register: no shipped software reads one before writing it, and both drivers only ever see a post-firmware state. A register's grade is the grade of its hardware meaning; what the drivers write is recorded in its doc, and where a doc says the driver writes are established, that holds whatever the grade says. Register names are the ones the public Linux header uses, which the miniport symbol tables also carry; field names are the Linux header names where it defines one and our own plain description otherwise."
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport and its program database (the gberegs structure); Linux frame buffer driver header (struct asregs and the DBE definitions)"
public_from = ["SGI Cobalt Graphics Driver 5.2.4", "Linux frame buffer driver", "SGI Visual Workstation PROM 1.1005"]
name_source = "ours"

[spaces.retrace]
unit = "byte"
doc = "The 32-bit retrace latch window, a mapping separate from the main block; its offset 0 is the window base."

# Enums
[enums.frame_depth]
values = { bpp8 = { value = 0, grade = "established" }, bpp16 = { value = 1, grade = "established" }, bpp32 = { value = 2, grade = "established" }, reserved = { value = 3, grade = "unknown", doc = "no driver writes it; behaviour unknown" } }

[enums.did_pixel_type]
doc = "Pixel type of a window in the per-window mode table: the values the Linux header names. Which hardware path each selects is inferred from the O2 display back end."
values = { index8 = { value = 0, grade = "inferred" }, index12 = { value = 1, grade = "inferred" }, rg3b2 = { value = 2, grade = "inferred" }, rgb4 = { value = 3, grade = "inferred" }, argb5 = { value = 4, grade = "inferred" }, rgb8 = { value = 5, grade = "inferred" }, rgba5 = { value = 6, grade = "inferred" }, rgb10 = { value = 7, grade = "inferred" } }

[enums.did_buffer_mode]
values = { both = { value = 3, grade = "inferred" } }

[registers.ctrlstat]
offset = 0x0
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, mode-set routine"
doc = "General control and status. The mode-set routine of the NT miniport writes the value with the clock selector at 3 as its last step; Linux writes the selector at 2 before programming and 3 afterwards when bit 25 reads set; the firmware does the same, and with a flat panel ORs in bit 26 instead of writing the selector 3. The firmware reads the low nibble as the chip revision (a real 320 shows display engine 002). Linux treats a clock selector below 2 as not scanning out from the internal dot clock."
[registers.ctrlstat.fields]
chipid = { bits = [3, 0], grade = "inferred", doc = "chip revision as the firmware reads it; a real 320 reports 2 (see the real-machine revision constant). Reset value unknown" }
sense_n = { bits = [4, 4], grade = "unknown", doc = "named in the Linux header; no shipped driver reads or writes it" }
bit25 = { bits = [25, 25], grade = "unknown", doc = "meaning unknown; the firmware writes the selector 3 only when this reads set, so a model should read it as 1" }
bit26 = { bits = [26, 26], grade = "unknown", doc = "set by the firmware and the NT 4.0 HAL when a flat panel answered; meaning unknown" }
pclksel = { bits = [29, 28], grade = "inferred", doc = "dot clock source: 3 selects the internal dot clock in every writer" }

[registers.dotclock]
offset = 0x4
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, mode-set routine"
doc = "Dot clock PLL. Software writes M-1 and N-1. The output is 27 MHz times M over N, divided by 2 to the P; that reproduces the clock column of 26 of the 27 rows of the NT mode table to within 1.4 percent. No lock bit is read and every wait is a plain delay. The NT miniport clears everything above bit 15, restarts the PLL through a fixed sequence with RUN set and cleared and 40 ms, one second and 100 ms delays, then writes the final value without RUN, waits 40 ms and sets RUN; Linux and the firmware write the final value with RUN and wait 11 ms; the NT 4.0 HAL clears the bits above 15 and writes the value with RUN with no wait."
[registers.dotclock.fields]
m = { bits = [7, 0], grade = "inferred", doc = "feedback multiplier minus 1" }
n = { bits = [13, 8], grade = "inferred", doc = "reference divider minus 1" }
p = { bits = [15, 14], grade = "inferred", doc = "output divider as a power of two" }
run = { bits = [20, 20], grade = "inferred", doc = "PLL run" }

[registers.i2c]
offset = 0x8
width = 32
access = "rw"
grade = "established"
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, bit-bang routines and the EDID reader"
doc = "CRT I2C lines (DDC). One register is both the write and the read-back location. Writing a bit as 1 pulls the line low and writing 0 lets it float high; a read returns 1 when the line is low. With no device both lines read 0. The EDID reader tries device write addresses 0xa2, 0xa6 and 0xa0 in that order."
[registers.i2c.fields]
sda = { bits = [0, 0], grade = "established", doc = "data line" }
scl = { bits = [1, 1], grade = "established", doc = "clock line" }

[registers.sysclk]
offset = 0xc
width = 32
access = "rw"
grade = "unknown"
from = "Linux frame buffer driver for the display back end, register block header and driver (name only)"
doc = "System clock PLL. Neither driver, the firmware nor the HAL touches it; the Linux header names it as the system clock PLL control. Nothing shipped depends on its contents."

[registers.i2cfp]
offset = 0x10
width = 32
access = "rw"
grade = "established"
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, bit-bang routines and the flat-panel status routines"
doc = "Flat-panel I2C lines, the same layout and sense as the CRT register. The flat-panel status device answers at write address 0x70 and read address 0x71; bits 7:5 of its status byte are the panel id (5 is the 1600 by 1024 digital panel) and bit 2 is power-save. The firmware reads it twice when the first try gets no answer, and when the CRT EDID reader finds a flat panel it uses this register instead of the CRT one."
[registers.i2cfp.fields]
sda = { bits = [0, 0], grade = "established", doc = "data line" }
scl = { bits = [1, 1], grade = "established", doc = "clock line" }

[registers.id]
offset = 0x14
width = 32
access = "r"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, adapter attach check; the firmware self-test"
doc = "Device id. The NT miniport compares the whole dword with the value in the ID constant and does not attach otherwise; the Windows 2000 drivers compare the low 16 bits; the firmware self-test compares the whole dword. A read of that value passes every reader (established as the check; what the value means is inferred)."

[registers.config]
offset = 0x18
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, mode-set routine"
doc = "Output configuration. The NT miniport writes bits 7, 6, 5, 2 and 0, sets bit 0 when the mode asks for sync on green (the sync-on-green bit), always sets bit 3, and clears bit 0 when a flat panel answered unless the mode carries the key flag. Linux defines a frame-buffer value that sets bits 7, 5, 2, 1 and 0 but never writes the register; the firmware writes that value; the NT 4.0 HAL writes the same and ORs in bit 3. The Windows 2000 frame buffer driver writes bits 7, 5, 2 and 0, with bit 3 added for a flat panel, and its boot video driver one further value. Nothing shipped writes bit 6 or bit 1 on its own. A model should accept any value. The firmware self-test walks bits 7:5 and 3:0 (bit 4 is not tested)."
[registers.config.fields]
vdac_enable = { bits = [0, 0], grade = "inferred", doc = "video DAC enable" }
vdac_gsync = { bits = [1, 1], grade = "inferred", doc = "sync on green" }
vdac_pblank = { bits = [2, 2], grade = "inferred", doc = "pixel blank" }
fpenable = { bits = [3, 3], grade = "inferred", doc = "flat panel enable" }
lendian = { bits = [5, 5], grade = "inferred", doc = "little-endian pixel memory; not settled" }
tilehist = { bits = [6, 6], grade = "inferred", doc = "tile history" }
ext_addr = { bits = [7, 7], grade = "inferred", doc = "extended addressing" }

[registers.bist]
offset = 0x1c
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver (name only); SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Built-in self-test. Neither driver reads it. The firmware self-test writes 0, polls bit 31 for completion and reports a failure when any of bits 27:24 is set. Release 1.0006 also compares the register with a mask of 0x0ff0ffff for zero. The layout of the failure bits is unknown."
[registers.bist.fields]
done = { bits = [31, 31], grade = "inferred", doc = "self-test complete" }
fail = { bits = [27, 24], grade = "inferred", doc = "failure bits; layout unknown" }

[registers.vt_xy]
offset = 0x10000
width = 32
access = "rw"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, scan-line and mode-set routines; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Current dot coordinates. The live line is read from bits 23:12 (the scan-line poll); bit 31 is the timing counter freeze: it reads back what software set by writing the top bit and clears when software writes 0. Software tests the freeze bit with a byte load of the top byte, and the NT miniport, the Windows 2000 frame buffer driver, the NT 4.0 HAL and the firmware all do. The firmware's non-graphics console path writes the freeze bit alone."
[registers.vt_xy.fields]
x = { bits = [11, 0], grade = "inferred", doc = "live horizontal position" }
y = { bits = [23, 12], grade = "inferred", doc = "live line" }
vt_freeze = { bits = [31, 31], grade = "inferred", doc = "timing counter frozen" }

