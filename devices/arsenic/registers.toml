doc = "Per-window mode table of 32 words, the window id table. Linux fills all 32 identically (8 bits per pixel as index, 16 as RGBA5, 32 as RGB8); the firmware and the Windows 2000 boot video driver write 3 into all 32; the Windows 2000 frame buffer driver writes only the first word, 3 for 8 bits per pixel and 0x17 for 32. The SGI 5.2.4 miniport does not write the table."
[registers.mode_regs.fields]
wid_buf = { bits = [1, 0], grade = "inferred", enum = "did_buffer_mode", doc = "buffer mode; 3 selects both buffers" }
wid_typ = { bits = [4, 2], grade = "inferred", enum = "did_pixel_type", doc = "pixel type" }
wid_cm_bank = { bits = [9, 5], grade = "inferred", doc = "colour map bank select: the upper five bits of the colour map index for an 8-bit index pixel, 256 entries to a bank. From the O2 display back end specification; no Arsenic driver or firmware writes a non-zero value (every value written has these bits clear)" }
wid_gamma_bypass = { bits = [10, 10], grade = "inferred", doc = "gamma bypass: 1 disables the gamma map, 0 enables it. From the O2 display back end specification; no Arsenic driver sets it" }

[registers.cmap]
offset = 0x50000
width = 32
access = "w"
count = 6144
stride = 4
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, colour register routine; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Colour map, 6144 entries in the Linux declaration (the O2 display back end specification says 4608), one dword each. Both drivers write an entry as red in 31:24, green in 23:16 and blue in 15:8. Before every 32nd entry the NT miniport waits on the FIFO status; the Windows 2000 boot video driver waits before every entry."
[registers.cmap.fields]
red = { bits = [31, 24], grade = "inferred" }
green = { bits = [23, 16], grade = "inferred" }
blue = { bits = [15, 8], grade = "inferred" }

[registers.cm_fifo]
offset = 0x58000
width = 32
access = "r"
grade = "inferred"
from = "Linux frame buffer driver for the display back end, register block header and driver; SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, display miniport, colour register routine; SGI Visual Workstation PROM 1.1005, display start-up code"
doc = "Colour map FIFO status. Linux waits until it reads non-zero and then writes that many entries. The NT miniport, before every 32nd entry, spins until the low six bits read zero or the value reaches 0x30. The firmware waits while the low six bits are non-zero and above 0x10 is not reached. The Windows 2000 boot video driver needs the low six bits above 0x30. A value of 0x3f satisfies all four readers and 0x40 fails the boot video driver. Meaning inferred as a free-entry count."
[registers.cm_fifo.fields]
free_entries = { bits = [5, 0], grade = "inferred", doc = "free entries in the colour map write FIFO" }

[registers.gmap]
