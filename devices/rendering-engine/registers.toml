en_color_test = { bits = [22, 22], grade = "inferred" }
en_fog = { bits = [21, 21], grade = "inferred" }
en_color_matrix = { bits = [20, 20], grade = "inferred" }
en_pixel_xfer = { bits = [19, 19], grade = "inferred" }
en_texture = { bits = [18, 18], grade = "inferred" }
