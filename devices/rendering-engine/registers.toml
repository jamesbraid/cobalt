unit = "rendering_engine"
prefix = "RENG"
block = "RENG"
title = "Rendering engine register window"
doc = "The registers of the rendering engine window that the Windows NT 4.0 kernel driver reads or writes directly, and the 32-bit payload words of the packets the drivers send. The window is the range the driver maps; offsets below are from its base. Access records what the drivers do to the register at its own address, directly: a register that only a packet writes shows the direct accesses only (the scissor pair is \"r\" for that reason). Nothing here is a reset value, and no register is read before it is written."
from = "SGI Cobalt Graphics Driver 5.2.4 for Windows NT 4.0, kernel driver and display driver code, with the bit layouts of the register words checked against the driver's type declarations"
public_from = ["SGI Cobalt Graphics Driver 5.2.4"]
name_source = "ours"

# What the hardware does with any of these is inferred at best: the drivers are the only witness. A
# register's grade says that the driver access is read in full; a field's grade is its own.

[registers.tlb_entry]
offset = 0x8000
width = 32
access = "w"
count = 2048
stride = 8
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, hardware start-up and the translation-table packets"
doc = "Translation table: one entry per tile of the buffers the engine addresses. A tile is 1, 4, 16, 64 or 256 pages of 4 KB, as the buffer's descriptor says; the packet pool is 16 tiles of 256 pages, so it fills 16 entries. Only the low dword is ever written, with the tile's first 4 KB page frame number masked to 24 bits; entries not in use hold the first entry's value. The packet pool, the display buffers and the textures are named through these entries, so the engine fetches packets through this table rather than by physical address."
[registers.tlb_entry.fields]
page_frame = { bits = [23, 0], grade = "inferred", doc = "4 KB page frame number of the first page of the tile" }

[registers.buffer_desc]
offset = 0xc000
width = 32
access = "w"
count = 64
stride = 8
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, hardware start-up and the translation-table packets; the OpenGL driver's buffer-descriptor writers"
doc = "Buffer descriptor table: entry k describes the buffer whose descriptor id is k, the six-bit id the colour-format, depth-format and texture-format words carry. Entry 0 is the packet pool. The low dword only is written. A tiled buffer is a run of tiles of 128 or 512 bytes in a row, with row_tiles tiles per row, whose pages start at the translation-table slot named by slot; a user buffer mapped linearly sets bit 19 (row_tiles 32) with the tile_pages_log4 bits kept, and the packet pool sets pool_flag and row_tiles 1."
[registers.buffer_desc.fields]
slot = { bits = [31, 21], grade = "inferred", doc = "first translation-table slot of the buffer" }
row_tiles = { bits = [20, 14], grade = "inferred" }
tile_size_sel = { bits = [13, 13], grade = "inferred", doc = "0 for a 128-byte tile, 1 for 512 bytes" }
tile_pages_log4 = { bits = [12, 10], grade = "inferred", doc = "log base 4 of the pages in one tile: 1, 4, 16, 64 or 256 pages give 0 to 4" }
pool_flag = { bits = [9, 9], grade = "inferred", doc = "set for the packet pool; the driver sets it when the tile width is neither 128 nor 512" }

[registers.exec_ctl]
offset = 0x10000
width = 32
access = "rw"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, hardware start-up, context switch and stop-event routines"
doc = "Starts the engine on a packet position and reports where it is. A write is the packet position (in 32-byte units from the pool base) shifted to bit 12, bit 11 and the idle count; the driver writes 2 as the idle count with every start and 0x40 with 0xfffff in the position field at start-up. A read returns the position in bits 31:12, and zero there means none, in which case the driver reads the chain register instead."
[registers.exec_ctl.fields]
pkt_pos = { bits = [31, 12], grade = "inferred" }
start = { bits = [11, 11], grade = "inferred", doc = "set in every write that starts or restarts a node, clear at start-up" }
idle_wait = { bits = [10, 0], grade = "inferred", doc = "the driver writes 2 here with every start and keeps the value in a per-adapter setting; what the engine does with the count is unknown" }

[registers.doorbell]
offset = 0x10008
width = 32
access = "w"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, the routines that queue work or resume a suspended context"
doc = "Written with a single bit from three routines. Two write it when work is appended to a non-deferred node or a timer event fires, with the current queue at 2, a node in the hardware and that node's chunk count 0. The third, which suspends a node, writes it when the node's status bits 3:1 are clear, its chunk count is below 1, status bit 9 is clear and the status byte above bit 7 is non-zero."
[registers.doorbell.fields]
kick = { bits = [10, 10], grade = "inferred" }

[registers.int_cause]
offset = 0x10018
width = 32
access = "rw"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, interrupt handler, context switch and stop-event routines"
doc = "The interrupt handler treats a read of zero as not its own, masks the value with the two cause bits, writes zero and waits for the masked bits to change. The context switch waits for bit 31 to read set and then writes every bit but 31 set."
[registers.int_cause.fields]
ctx_wait = { bits = [31, 31], grade = "inferred", doc = "polled after the outgoing context's dump offset is written, before the next context starts" }
cause_30 = { bits = [30, 30], grade = "inferred", doc = "second cause bit: gates status bit 5 of the stopped node, the chunk decrement and the wake of waiter kind 8 in the event routine" }
cause_29 = { bits = [29, 29], grade = "inferred", doc = "first cause bit: queues the same event and wakes the same waiters bar kind 8" }

[registers.int_enable]
offset = 0x10020
width = 32
access = "w"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, hardware start-up"
doc = "Written once, with both cause bits set."
[registers.int_enable.fields]
en_30 = { bits = [30, 30], grade = "inferred" }
en_29 = { bits = [29, 29], grade = "inferred" }

[registers.scissor_min]
offset = 0x18138
width = 32
access = "r"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, the routine that builds the window-parameter packet; the OpenGL driver's scissor packet"
doc = "Scissor minimum corner, read into the window-parameter packet when the node already in the hardware is restarted. The window offset follows from the scissor packet's address field."
[registers.scissor_min.fields]
x = { bits = [15, 0], grade = "inferred" }
y = { bits = [31, 16], grade = "inferred" }

[registers.scissor_max]
offset = 0x18140
width = 32
access = "r"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, the routine that builds the window-parameter packet; the OpenGL driver's scissor packet"
doc = "Scissor maximum corner, inclusive."
[registers.scissor_max.fields]
x = { bits = [15, 0], grade = "inferred" }
y = { bits = [31, 16], grade = "inferred" }

[registers.chain_next]
offset = 0x185c0
width = 32
access = "r"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, stop-event routine, and the chain packet the OpenGL driver ends a node with"
doc = "The first word of the chain packet. The stop-event routine reads it: the low 12 bits are the high half of a 24-bit sequence number and bits 31:12 a node position, which it falls back to when the execution register reads zero."
[registers.chain_next.fields]
node_pos = { bits = [31, 12], grade = "inferred" }
seq_hi = { bits = [11, 0], grade = "inferred" }

[registers.chain_this]
offset = 0x185c8
width = 32
access = "rw"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, context switch and stop-event routines"
doc = "The second word of the chain packet. Bits 31:12 are the position of the node the engine stopped in and bits 11:0 the low half of the sequence number. The context switch writes zero to it when the incoming node is already the one in hardware."
[registers.chain_this.fields]
node_pos = { bits = [31, 12], grade = "inferred" }
seq_lo = { bits = [11, 0], grade = "inferred" }

[registers.bound_texture_id]
offset = 0x185d0
width = 32
access = "rw"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, context switch, stop-event and bind routines; the OpenGL driver's texture-free packet"
doc = "The third word of the long chain packet. The kernel driver keeps a per-context current-texture id and writes it here when it starts the context and reads it back at a stop; the OpenGL driver zeroes it before it frees the pages of the bound texture."

[registers.ctx_dump]
offset = 0x18800
width = 32
access = "w"
grade = "inferred"
from = "SGI Cobalt Graphics Driver 5.2.4 kernel driver, context switch"
doc = "Written with the outgoing context's dump offset (a per-context field the driver keeps for the purpose) when another context is started, before the new context's start word."

# Payload words. Names are ours; where one equals an OpenGL parameter name (min_filter, mag_filter, wrap_s, wrap_t, cull_face,
# front_face, line_width, lod_bias, max_level, min_level, two_sided) it is that public name. Bit positions were checked against the driver's type declarations; the grade is for the layout.
# Packet header values are in the packet-set page.

